<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  background:transparent !important;
  overflow:hidden;
  font-family:'Courier New',monospace;
  color:#f0efff;
}
body{
  padding:0;              /* 移除 padding，让内容完全撑满 */
  opacity:0;
  transition:opacity .2s steps(4);
}
body.show{
  opacity:1;
  animation:slideIn .25s steps(6) .02s both;
}
.t{
  width:100%;             /* 从固定 304px 改为 100% */
  height:100%;            /* 从固定 84px 改为 100% */
  background:#1d1840;
  display:flex;gap:10px;padding:10px;  /* 保留内部 padding，用于内容与窗口边缘的间距 */
  position:relative;
  box-shadow:
    inset 2px 2px 0 #0a0818,
    inset -2px -2px 0 #8c82ff;
}
.t::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    rgba(0,0,0,.2) 0,
    rgba(0,0,0,.2) 1px,
    transparent 1px,
    transparent 3px
  );
  z-index:10;
}
.th{
  width:64px;height:64px;flex-shrink:0;
  background:#0a0818;
  box-shadow:
    inset 2px 2px 0 #0a0818,
    inset -2px -2px 0 #8c82ff;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.th img{
  max-width:100%;max-height:100%;
  image-rendering:pixelated;
}
.in{
  flex:1;display:flex;flex-direction:column;
  justify-content:center;gap:4px;overflow:hidden;
  position:relative;z-index:1;
}
.mt{
  display:inline-flex;align-items:center;gap:4px;
  font-weight:bold;font-size:10px;
  padding:2px 6px;
  background:#7fffd4;color:#0a0818;
  align-self:flex-start;
  font-family:'Courier New',monospace;
  letter-spacing:1px;
}
.mt.video{background:#ffee78}
.mt.motion{background:#ff6eb4}
.gn{
  font-weight:bold;font-size:12px;
  color:#7fffd4;
  text-shadow:1px 1px 0 #0a0818;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:1px;
}
.fn{
  font-size:13px;
  color:#9b94d4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.st{
  font-size:12px;
  color:#7fffd4;
  display:flex;align-items:center;gap:6px;
  font-weight:bold;
  letter-spacing:1px;
}
.dt{
  width:8px;height:8px;
  background:#7fffd4;
  box-shadow:
    inset -2px -2px 0 #2da88a,
    inset 2px 2px 0 #b8ffe8;
}
@keyframes slideIn{
  from{transform:translateX(340px)}
  to{transform:translateX(0)}
}
</style></head><body>
<div class="t"><div class="th"><img id="thumb" src=""></div>
<div class="in"><div class="mt" id="mode">SNAP IMAGE</div><div class="gn" id="game"></div><div class="fn" id="file"></div><div class="st"><span class="dt"></span>COMPLETED!</div></div></div>
<script>
window.__setToastData = function(mode, game, fname, thumbB64) {
  var modeEl = document.getElementById('mode');
  var gameEl = document.getElementById('game');
  var fileEl = document.getElementById('file');
  var thumbEl = document.getElementById('thumb');
  var modeMap = {
    'VIDEO': { cls: 'video', label: '\u25B6 VIDEO' },
    'MOTION': { cls: 'motion', label: '\u2726 MOTION' },
    'IMAGE': { cls: '', label: 'SNAP IMAGE' }
  };
  var mi = modeMap[mode] || modeMap['IMAGE'];
  modeEl.textContent = mi.label;
  modeEl.className = 'mt' + (mi.cls ? ' ' + mi.cls : '');
  gameEl.textContent = game;
  fileEl.textContent = fname;
  thumbEl.src = 'data:image/png;base64,' + thumbB64;
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ document.body.classList.add('show'); });
  });
};
</script>
</body></html>
