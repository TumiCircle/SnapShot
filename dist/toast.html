<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  background:transparent !important;
  overflow:hidden;
  font-family:'VT323',monospace;
  color:#f0efff;
  -webkit-font-smoothing:none; font-smooth:never;
}
body{
  padding:0;              /* 移除 padding，让内容完全撑满 */
  opacity:0;
  transition:opacity .2s steps(4);
}
body.show{
  opacity:1;
  animation:slideIn .25s steps(6) .02s both;
}
.t{
  width:100%;             /* 从固定 304px 改为 100% */
  height:100%;            /* 从固定 84px 改为 100% */
  background:#1d1840;
  border-radius:8px;
  overflow:hidden;
  display:flex;gap:8px;padding:8px;  /* 保留内部 padding，用于内容与窗口边缘的间距 */
  position:relative;
  box-shadow:
    inset 2px 2px 0 #0a0818,
    inset -2px -2px 0 #8c82ff;
}
.t::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    rgba(0,0,0,.2) 0,
    rgba(0,0,0,.2) 1px,
    transparent 1px,
    transparent 3px
  );
  z-index:10;
}
.th{
  width:60px;height:60px;flex-shrink:0;
  border-radius:4px;
  background:#0a0818;
  box-shadow:
    inset 2px 2px 0 #0a0818,
    inset -2px -2px 0 #8c82ff;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.th img{
  max-width:100%;max-height:100%;
  image-rendering:pixelated;
}
.in{
  flex:1;display:flex;flex-direction:column;
  justify-content:center;gap:4px;overflow:hidden;
  position:relative;z-index:1;
}
.mt{
  display:inline-flex;align-items:center;gap:4px;
  font-size:9px;
  font-family:'Press Start 2P',monospace;
  padding:2px 6px;
  background:#7fffd4;color:#0a0818;
  align-self:flex-start;
  letter-spacing:1px;
}
.mt.video{background:#ffee78}
.mt.motion{background:#ff6eb4}
.mt.error{background:#ff4d6d}
.msg{
  font-size:16px;
  font-family:'VT323',monospace;
  color:#b8b2e8;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:0.5px;
}
.st{
  font-size:10px;
  font-family:'Press Start 2P',monospace;
  color:#7fffd4;
  display:flex;align-items:center;gap:6px;
  font-weight:bold;
  letter-spacing:1px;
}
.st.error{
  color:#ff4d6d;
}
.st.error .dt{
  background:#ff4d6d;
  box-shadow:
    inset -2px -2px 0 #8f1f36,
    inset 2px 2px 0 #ff9db1;
}
.dt{
  width:8px;height:8px;
  background:#7fffd4;
  box-shadow:
    inset -2px -2px 0 #2da88a,
    inset 2px 2px 0 #b8ffe8;
}

.st.rec{
  color:#ff4d6d;
}
.st.rec .dt{
  background:#ff4d6d;
  box-shadow:
    inset -2px -2px 0 #8f1f36,
    inset 2px 2px 0 #ff9db1;
  animation:recBlink .8s steps(1) infinite;
}
@keyframes recBlink{
  0%,49%{opacity:1}
  50%,100%{opacity:.25}
}
@keyframes slideIn{
  from{transform:translateX(340px)}
  to{transform:translateX(0)}
}
</style></head><body>
<div class="t"><div class="th"><img id="thumb" src=""></div>
<div class="in"><div class="mt" id="mode">SNAP IMAGE</div><div class="msg" id="msg"></div><div class="st" id="status"><span class="dt"></span><span id="status-text">COMPLETED!</span></div></div></div>
<script>
var I18N = {
  en: {
    IMAGE: 'SNAP IMAGE',
    VIDEO: '\u25B6 VIDEO',
    MOTION: '\u2726 MOTION',
    ERROR: '\u0021 ERROR',
    COMPLETED: 'COMPLETED!',
    FAILED: 'FAILED!',
    CAPTURE_FAILED: 'CAPTURE FAILED',
    CAPTURING: 'CAPTURING...'
  },
  zh: {
    IMAGE: '\u56FE\u7247\u5FEB\u7167',
    VIDEO: '\u25B6 \u89C6\u9891',
    MOTION: '\u2726 \u52A8\u56FE',
    ERROR: '\u0021 \u9519\u8BEF',
    COMPLETED: '\u5B8C\u6210!',
    FAILED: '\u5931\u8D25!',
    CAPTURE_FAILED: '\u6355\u83B7\u5931\u8D25',
    CAPTURING: '\u6B63\u5728\u6355\u83B7...'
  }
};
function translateErrorZh(msg) {
  if (!msg) return msg;
  var map = [
    ['No valid foreground window', '\u672A\u627E\u5230\u6709\u6548\u7684\u524D\u53F0\u7A97\u53E3\uFF0C\u8BF7\u5148\u70B9\u51FB\u76EE\u6807\u7A97\u53E3'],
    ['Timed out waiting for first GIF frame', '\u7B49\u5F85 GIF \u9996\u5E27\u8D85\u65F6'],
    ['Not enough frames captured', '\u91C7\u96C6\u5230\u7684\u5E27\u6570\u4E0D\u8DB3'],
    ['Video encoding timed out', '\u89C6\u9891\u7F16\u7801\u8D85\u65F6'],
    ['Capture timed out', '\u6355\u83B7\u8D85\u65F6'],
    ['Window closed during capture', '\u6355\u83B7\u671F\u95F4\u7A97\u53E3\u88AB\u5173\u95ED'],
    ['Save failed', '\u4FDD\u5B58\u5931\u8D25'],
    ['Failed to create file', '\u521B\u5EFA\u6587\u4EF6\u5931\u8D25'],
    ['Failed to start capture', '\u542F\u52A8\u6355\u83B7\u5931\u8D25']
  ];
  for (var i = 0; i < map.length; i++) {
    if (msg.indexOf(map[i][0]) !== -1) return map[i][1];
  }
  return msg;
}
window.__setToastData = function(mode, game, fname, thumbB64, lang, status) {
  var d = I18N[lang === 'zh' ? 'zh' : 'en'] || I18N.en;
  var modeEl = document.getElementById('mode');
  var msgEl = document.getElementById('msg');
  var thumbEl = document.getElementById('thumb');
  var modeMap = {
    'VIDEO': { cls: 'video', label: d.VIDEO },
    'MOTION': { cls: 'motion', label: d.MOTION },
    'IMAGE': { cls: '', label: d.IMAGE },
    'ERROR': { cls: 'error', label: d.ERROR }
  };
  var mi = modeMap[mode] || modeMap['IMAGE'];
  modeEl.textContent = mi.label;
  modeEl.className = 'mt' + (mi.cls ? ' ' + mi.cls : '');
  if (status === 'rec') {
    msgEl.textContent = '';
    document.getElementById('status-text').textContent = 'REC';
  } else if (mode === 'ERROR') {
    msgEl.textContent = lang === 'zh' ? translateErrorZh(fname) : fname;
    document.getElementById('status-text').textContent = d.FAILED;
  } else {
    msgEl.textContent = fname;
    document.getElementById('status-text').textContent = d.COMPLETED;
  }
  document.getElementById('status').className = 'st' + (mode === 'ERROR' ? ' error' : status === 'rec' ? ' rec' : '');
  thumbEl.src = 'data:image/png;base64,' + thumbB64;
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ document.body.classList.add('show'); });
  });
};
</script>
</body></html>
