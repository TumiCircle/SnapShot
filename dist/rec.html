<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  background: transparent !important;
  overflow: hidden;
  /* 窗口尺寸进一步缩小，适合紧凑布局 */
  width: 150px;
  height: 40px;
  font-family: 'Press Start 2P', monospace;
}
.rec-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;               /* 减小间距 */
  width: 100%;
  height: 100%;
  background: transparent;
}
.rec-dot {
  width: 24px;            /* 红点缩小 */
  height: 24px;
  background: #ff4d6d;
  border: 1px solid #0f0f1a;  /* 边框变细 */
  box-shadow: inset -2px -2px 0 #000000, inset 2px 2px 0 #ffc2c2;
  animation: blink 2s steps(2) infinite;
  flex-shrink: 0;
}
@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0.2; }
}
.rec-text {
  color: #ff4d6d;
  font-size: 36px;          /* 文字缩小 */
  font-weight: normal;
  letter-spacing: 2px;      /* 间距减小 */
  text-shadow:
    /* 阴影偏移减为1px，更细 */
    2px 0 0 #0f0f1a,
    -2px 0 0 #0f0f1a,
    0 2px 0 #0f0f1a,
    0 -2px 0 #0f0f1a,
    2px 2px 0 #0f0f1a,
    -2px -2px 0 #0f0f1a,
    2px -2px 0 #0f0f1a,
    -2px 2px 0 #0f0f1a;
}
</style>
</head><body>
<div class="rec-wrap">
  <div class="rec-dot"></div>
  <span class="rec-text">REC</span>
</div>
</body></html>
