name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release exe
        shell: pwsh
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Write UTF-8 release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $body = @"
          ## PixelSnap $tag

          ### 修复与改进
          - GIF 流式编码：边采边写，长录制内存占用保持恒定
          - 视频码率可调（1-20 Mbps，默认 8 Mbps）
          - 错误信息直接显示在 Toast 中，录制中可提前停止并正常封口
          - 日志写入 %APPDATA%\PixelSnap\logs\pixelsnap.log
          - 修复音轨电流噪声、视频时长与录制超时、GIF 保存速度
          - 文件名前缀可留空，命名统一 image/video/motion
          - 截图排除 Windows 标题栏，配置合并式保存，应用单实例

          ### 下载
          - PixelSnap_$tag.exe
          "@
          Set-Content -Path release-notes.md -Value $body -Encoding utf8

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag "src-tauri/target/release/pixelsnap.exe#PixelSnap_$tag.exe" --title "PixelSnap $tag Release" --notes-file release-notes.md
