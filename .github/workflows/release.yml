name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release exe
        shell: pwsh
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Write UTF-8 release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $body = @"
          ## PixelSnap $tag

          ### 修复与改进
          - Toast 即时反馈：截图立即显示 COMPLETED，视频/GIF 录制显示 REC，完成后原地切换
          - 录制弹窗稳定显示，提示音与弹窗同步触发
          - 配置按分类保存（mode / output / hotkeys / recording / appearance / behavior），前端读取不再重置设置
          - 透明度语义反转：100% 不透明，0% 全透明，默认 100%
          - 流星覆盖主界面、辉光增强并与前台 UI 联动；星星光晕与闪烁速度优化
          - 外观滑杆回退为连续滑杆（0-100%），移除废弃配置与独立 REC 小窗

          ### Highlights
          - Instant toast feedback with in-place REC -> completed switching
          - Categorized config file; settings no longer reset on startup
          - Transparency reversed: 100% = opaque, 0% = fully transparent
          - Meteors sweep across the UI with glow and foreground lighting

          ### 下载
          - PixelSnap_$tag.exe
          "@
          Set-Content -Path release-notes.md -Value $body -Encoding utf8

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag "src-tauri/target/release/pixelsnap.exe#PixelSnap_$tag.exe" --title "PixelSnap $tag Release" --notes-file release-notes.md
